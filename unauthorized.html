<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AsteraHR — Access Denied</title>
  <link rel="stylesheet" href="assets/css/tokens.css"/>
  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
  <style>
    html, body { height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--cream); }
    .wrap { text-align: center; max-width: 440px; padding: 32px; }
    .icon-ring {
      width: 88px; height: 88px; border-radius: 50%;
      background: rgba(185,28,28,.07); border: 1.5px solid rgba(185,28,28,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; margin: 0 auto 24px;
      animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
    }
    h1 { font-family: var(--f-serif); font-size: 36px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
    p  { font-size: 14px; font-weight: 300; color: var(--ink-s); line-height: 1.7; margin-bottom: 28px; }
    .btns { display: flex; gap: 12px; justify-content: center; }
  </style>
</head>
<body>
<div class="wrap anim-up">
  <div class="icon-ring">🚫</div>
  <h1>Access Denied</h1>
  <p>
    You don't have permission to view this page.<br>
    Your current role does not include access to this resource.<br>
    Contact your HR Administrator if you believe this is an error.
  </p>
  <div class="btns">
    <button class="btn btn-ghost" onclick="history.back()">
      <span class="btn-text">← Go Back</span>
    </button>
    <button class="btn btn-navy" id="dash-btn">
      <span class="btn-text">My Dashboard</span>
    </button>
  </div>
  <p style="margin-top:20px;font-size:12px;color:var(--ink-g)">
    Error code: <span style="font-family:var(--f-mono)">403 FORBIDDEN</span>
  </p>
</div>

<script src="data/mock-data.js"></script>
<script src="assets/js/session.js"></script>
<script src="assets/js/rbac.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const s = Session.get();
    const btn = document.getElementById('dash-btn');
    if (s && btn) btn.onclick = () => window.location.href = RBAC.dashboardFor(s.role);
    else if (btn) btn.onclick = () => window.location.href = 'login.html';
  });
</script>
</body>
</html>
